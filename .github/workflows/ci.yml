name: Android CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Verify Brand Identity
      run: python3 tools/verify_brand_identity.py

    - name: Run Lint
      run: ./gradlew :app:lint --no-daemon

    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest --no-daemon

    - name: Build Debug APKs
      run: ./gradlew assembleDebug :app:assembleDebugAndroidTest --no-daemon

    - name: Verify APKs Generated
      run: |
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "Debug APK not found!"
          exit 1
        fi
        if [ ! -f "app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" ]; then
          echo "AndroidTest APK not found!"
          exit 1
        fi
        echo "APKs successfully built."

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Test APK
      uses: actions/upload-artifact@v4
      with:
        name: app-test-apk
        path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  e2e-emulator:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      APP_ID: org.zmreborn

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug

    - name: Download Test APK
      uses: actions/download-artifact@v4
      with:
        name: app-test-apk
        path: app/build/outputs/apk/androidTest/debug

    - name: Run E2E Emulator Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 23
        target: default
        arch: x86
        profile: Nexus 6
        disable-linux-hw-accel: true
        disable-animations: true
        emulator-boot-timeout: 600
        emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
        script: |
          set -e
          echo "Checking emulator connection..."
          adb devices

          echo "Installing production APK..."
          adb install -r app/build/outputs/apk/debug/app-debug.apk

          echo "Installing androidTest APK..."
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

          echo "Running Instrumentation Tests (full suite)..."
          adb shell am instrument -w -r "${APP_ID}.test/android.test.InstrumentationTestRunner"

          echo "Running adb E2E smoke verification..."
          adb shell am force-stop "${APP_ID}"
          adb shell am start -W -n "${APP_ID}/.Launcher"
          sleep 3

          echo "Verifying focused window is Launcher..."
          focused=$(adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp')
          echo "Focused: $focused"

          echo "Dumping and verifying UI hierarchy..."
          adb shell uiautomator dump /sdcard/window_dump.xml
          adb pull /sdcard/window_dump.xml .

          if grep -q "${APP_ID}:id/workspace" window_dump.xml; then
            echo "SUCCESS: workspace found in UI hierarchy!"
          else
            echo "FAILURE: workspace not found in UI hierarchy!"
            cat window_dump.xml
            exit 1
          fi

    - name: Collect diagnostics on failure
      if: failure()
      run: |
        echo "Collecting adb logcat output..."
        adb logcat -d -v threadtime > logcat.log || true
        echo "Dumping window status..."
        adb shell dumpsys window > window.log || true
        echo "Checking process list..."
        adb shell ps > ps.log || true

    - name: Upload Diagnostics
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-diagnostics
        path: |
          *.log
          *.xml
        if-no-files-found: ignore
